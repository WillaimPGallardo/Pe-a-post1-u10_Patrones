# =============================================================
# sonar-project.properties
# Configuración del análisis estático con SonarQube
# Ubicación: raíz del proyecto (junto a pom.xml)
# =============================================================

# Identificador único del proyecto en SonarQube
sonar.projectKey=com.universidad:productos-service

# Nombre visible en el dashboard de SonarQube
sonar.projectName=Productos Service

# Versión del proyecto analizado
sonar.projectVersion=1.0

# Directorio con el código fuente principal (Java)
sonar.sources=src/main/java

# Directorio con los tests (para cobertura cruzada)
sonar.tests=src/test/java

# Binarios compilados que SonarQube analiza junto al fuente
sonar.java.binaries=target/classes

# Ruta del reporte XML generado por JaCoCo
# Se genera al ejecutar: mvn clean verify
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Excluir la clase main de Spring Boot del análisis
# (no contiene lógica de negocio testeable)
sonar.exclusions=**/*Application.java

# URL del servidor SonarQube local levantado con Docker
sonar.host.url=http://localhost:9000

# Si es true, el build falla cuando el Quality Gate no se cumple.
# Para este laboratorio se deja en false (solo se analiza, no se corrige)
sonar.qualitygate.wait=false
